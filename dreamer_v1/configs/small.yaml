# Dreamer V1 Small Configuration (3M params - original paper)
# Paper: Dream to Control (Hafner et al., 2020)
# Appendix A: Architecture Details

env: "dm_control/cheetah-run-v0"
device: "cuda"
action_repeat: 4
num_envs: 16

# Async & GPU Optimization
use_async: true
use_prefetch: true
pin_memory: true
mixed_precision: true
cudnn_benchmark: true
tf32: true
compile_model: false

# Training Schedule
training:
  total_steps: 500000
  initial_episodes: 5
  train_every: 1000
  train_steps: 100
  batch_size: 50
  seq_length: 50

# World Model (3M params - original paper)
model:
  embed_dim: 1024  # Original paper value
  num_units: 300   # "three dense layers of size 300 with ELU activations"
  lr: 0.0006
  kl_free_nats: 3.0
  kl_scale: 1.0
  rssm:
    stoch_dim: 30      # FIXED from paper (diagonal Gaussian)
    deter_dim: 200     # Original GRU hidden size
    hidden_dim: 300    # RSSM internal
    prior_min_std: 0.1
    posterior_min_std: 0.1

# Actor (Policy)
actor:
  lr: 0.00008
  horizon: 15
  action_min_std: 0.1
  action_max_std: 1.0
  entropy_coef: 0.0

# Critic (Value Function)
critic:
  lr: 0.00008
  gamma: 0.99
  lambda_: 0.95

# Replay Buffer
buffer:
  capacity: 5000000

# Logging
logging:
  eval_interval: 1000
  save_interval: 5000
  video_interval: 5000

# Algorithm Settings
algorithm:
  imagination_horizon: 15
  use_value_bootstrap: true
  gradient_clip_norm: 100.0
  video_interval: 50000
