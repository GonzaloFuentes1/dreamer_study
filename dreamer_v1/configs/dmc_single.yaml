# Configuration for Single Environment Training (DM Control Walker)
# EXACT paper replication: DreamerV1 (Hafner et al., 2020)
env: "dm_control/walker-walk-v0"
action_repeat: 2
device: "cuda"

# Training Schedule
training:
  total_steps: 2000000  # 2M steps como en el paper (single env)
  initial_episodes: 5
  train_every: 1000
  train_steps: 100
  batch_size: 50
  seq_length: 50

# World Model (theta)
model:
  embed_dim: 1024
  num_units: 400
  lr: 0.0006
  kl_free_nats: 3.0
  rssm:
    stoch_dim: 30
    deter_dim: 200
    hidden_dim: 200

# Behavior Learning (phi, psi)
actor:
  lr: 0.00008
  horizon: 15

critic:
  lr: 0.00008
  gamma: 0.99
  lambda: 0.95

# Buffer
buffer:
  capacity: 1000000
