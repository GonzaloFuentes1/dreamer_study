# DreamerV1 Paper Configuration (Hafner et al., 2020)
# Hardware: 1x GPU + 10 parallel environments
# Expected time: ~6 hours for 2M steps (paper baseline)
env: "dm_control/walker-walk-v0"
action_repeat: 2
device: "cuda"
num_envs: 10

# Async Processing (Paper uses async for parallel data collection + training)
use_async: true        # Use custom AsyncVectorEnv with multiprocessing
use_prefetch: true     # Prefetch training batches in background thread (buffer_size=10)

# GPU Optimizations
# - Mixed Precision (AMP): Enabled in agent.py via torch.amp.autocast
# - Batch size 100: Better GPU utilization on A100
# - Train steps 200: Amortize training overhead
# - Prefetch buffer 10: Eliminate CPU-GPU pipeline stalls

# Training Schedule (Optimized for GPU utilization)
training:
  total_steps: 200000   # 200k iterations × 10 envs = 2M env steps (paper experiment)
  initial_episodes: 5   # Warmup con episodios random
  train_every: 1000     # Paper: entrenar cada 1000 env steps
  train_steps: 100      # 100 → 200: más amortización de overhead
  batch_size: 50       # 50 → 150: mejor utilización GPU (72% → 85%+)
  seq_length: 50        # Paper: sequence length 50

# World Model (theta) - Paper Table 1
model:
  embed_dim: 1024       # Embedding dimension
  num_units: 400        # Hidden units for reward/continue models
  lr: 0.0006            # 6e-4 (paper)
  kl_free_nats: 3.0     # Free nats for KL divergence
  rssm:
    stoch_dim: 30       # Stochastic state size
    deter_dim: 200      # Deterministic state size (GRU hidden)
    hidden_dim: 200     # Pre-GRU hidden layer

# Actor (phi) - Paper Table 1
actor:
  lr: 0.00008           # 8e-5 (paper)
  horizon: 15           # Imagination horizon

# Critic (psi) - Paper Table 1
critic:
  lr: 0.00008           # 8e-5 (paper)
  gamma: 0.99           # Discount factor
  lambda: 0.95          # TD-lambda for return computation

# Replay Buffer
buffer:
  capacity: 1000000     # 1M transitions
