# DreamerV3: Atari Breakout (Discrete Actions)
# Paper: Mastering Diverse Domains through World Models (Hafner et al., 2023)
env: "BreakoutNoFrameskip-v4"
device: "cuda"
action_repeat: 4
num_envs: 10

# Training Schedule (Table 4)
training:
  total_steps: 1000000
  initial_episodes: 5
  train_every: 4
  train_steps: 1
  batch_size: 16
  seq_length: 64

# World Model (Table 4)
model:
  embed_dim: 1024
  lr: 0.00004  # 4e-5
  kl_free_nats: 1.0
  beta_pred: 1.0
  beta_dyn: 1.0
  beta_rep: 0.1
  rssm:
    stoch_dim: 32
    stoch_classes: 32
    deter_dim: 512
    hidden_dim: 512

# Actor (Table 4)
actor:
  horizon: 15
  entropy_coef: 0.0003

# Critic (Table 4)
critic:
  gamma: 0.997
  lambda: 0.95
  beta_val: 1.0
  beta_repval: 0.3
  ema_decay: 0.98

# Replay Buffer
buffer:
  capacity: 2000000

# Logging
logging:
  eval_interval: 100000
  save_interval: 500000
  video_interval: 500000
