# Dreamer V3 Cheetah Run Configuration
# Paper: Mastering Diverse Domains through World Models (Hafner et al., 2023)
# Key: Improved architectures (RMSNorm, BlockLinear), LaProp optimizer

env: "dm_control/cheetah-run-v0"
device: "cuda"
action_repeat: 4
num_envs: 16

# Async & GPU Optimization
use_async: true
use_prefetch: false
pin_memory: true
mixed_precision: true
cudnn_benchmark: true
tf32: true
compile_model: false

# Training Schedule (DMC)
training:
  total_steps: 500000
  initial_episodes: 10
  train_every: 5
  train_steps: 1
  batch_size: 16
  seq_length: 64

# World Model
model:
  embed_dim: 1024
  grayscale: false
  lr: 1e-4
  kl_free_nats: 1.0
  beta_pred: 1.0
  beta_dyn: 0.5
  beta_rep: 0.1
  rssm:
    deter_dim: 1024
    hidden_dim: 1024
    use_rms_norm: true
    use_block_linear: true
    min_std: 0.1

# Actor (Policy)
actor:
  lr: 3e-5
  horizon: 15
  entropy_coef: 3e-4
  std_min: 0.1
  std_max: 1.0
  use_stop_gradient: true

# Critic (Value Function)
critic:
  lr: 3e-5
  gamma: 0.997
  lambda_: 0.95
  slow_target_fraction: 0.02

# Replay Buffer
buffer:
  capacity: 1000000

# Logging
logging:
  eval_interval: 1000
  save_interval: 5000
  video_interval: 5000

# Algorithm Settings
algorithm:
  imagination_horizon: 15
  optimizer: "laprop"
  gradient_clip_norm: 100.0
  laprop_beta1: 0.9
  laprop_beta2: 0.999
  laprop_epsilon: 1e-8
