# DreamerV2: DMC Cheetah Run (Continuous Control)
# Paper: Mastering Atari with Discrete World Models (Hafner et al., 2021)
env: "dm_control/cheetah-run-v0"
device: "cuda"
action_repeat: 2
num_envs: 10

# Training Schedule
training:
  total_steps: 1000000
  initial_episodes: 5
  train_every: 4
  train_steps: 1
  batch_size: 150
  seq_length: 50

# World Model
model:
  embed_dim: 1024
  lr: 2e-4
  kl_alpha: 0.8
  kl_scale: 1.0
  kl_free_nats: 1.0
  rssm:
    stoch_dim: 32
    stoch_classes: 32
    deter_dim: 200
    hidden_dim: 200

# Actor
actor:
  lr: 4e-5
  horizon: 15
  rho: 0.0
  entropy_coef: 1e-4

# Critic
critic:
  lr: 1e-4
  gamma: 0.995
  lambda: 0.95

# Replay Buffer
buffer:
  capacity: 1000000

# Logging
logging:
  eval_interval: 10000
  save_interval: 50000
  video_interval: 50000
