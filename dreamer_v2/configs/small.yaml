# Dreamer V2 Small Configuration (~13M parameters)
# Scaled down version for faster training
# Based on walker_walk.yaml with reduced dimensions

env: "dm_control/walker-walk-v0"
device: "cuda"
action_repeat: 2
num_envs: 16  # Reduced for smaller model

# Async & GPU Optimization
use_async: true
use_prefetch: true
pin_memory: true
mixed_precision: true
cudnn_benchmark: true
tf32: true
compile_model: false

# Training Schedule
training:
  total_steps: 500000
  initial_episodes: 5
  train_every: 1000
  train_steps: 100
  batch_size: 50
  seq_length: 50

# World Model - SCALED DOWN
model:
  embed_dim: 1024
  grayscale: false
  lr: 0.0003
  kl_alpha: 0.8
  kl_scale: 1.0
  kl_free_nats: 3.0
  reward_transformation: "tanh"
  rssm:
    num_classes: 32
    class_dim: 32
    deter_dim: 600  # Reduced from 1024
    hidden_dim: 600  # Reduced from 1100

# Actor (Policy)
actor:
  lr: 0.00008
  horizon: 15
  rho: 0.0  # Paper: 0.0 for continuous (dynamics backprop), 1.0 for Atari (Reinforce)
  entropy_scale: 0.0001  # Paper: 1e-4 for continuous control

# Critic (Value Function)
critic:
  lr: 0.00008
  gamma: 0.995
  lambda_: 0.95
  slow_target_update: 100
  slow_target_fraction: 1.0

# Replay Buffer
buffer:
  capacity: 1000000

# Algorithm Settings
algorithm:
  imagination_horizon: 15
  use_straight_through: true
  gradient_clip_norm: 100.0

network:
  mlp_layers: 4
  mlp_units: 400
  
# Optimizer
optimizer:
  grad_clip: 100
  adam_eps: 0.00001
  weight_decay: 0.000001

# Logging
logging:
  eval_interval: 10000
  save_interval: 10000
  video_interval: 25000
